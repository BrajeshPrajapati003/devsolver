server:
  port: 8080

spring:
  output:
    ansi:
      enabled: always

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devsolver_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
#    driver-class-name: org.postgresql.Driver

  jpa:
#    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50

  web:
    resources:
      static-locations: file:uploads/ # configure static file access

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB # configure multipart limits


  ai:
    openai:
      api-key: ${GEMINI_API_KEY}
      base-url: ${GEMINI_BASE_URL:OLLAMA_BASE_URL}
      chat:
        options:
          model: ${GEMINI_MODEL:SMOLLM2_MODEL}

  security:
    user:
      name: user
      password: test@pass
